<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Garage İstanbul | Müşteri Memnuniyet Anketi</title>
  <link rel="stylesheet" href="./survey.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="survey-page">
    <section class="card">
      <img src="/logo.png" alt="Garage İstanbul Logo" class="logo" onerror="this.style.display='none'" />
      <h1>Müşteri Memnuniyet Anketi</h1>
      <p class="privacy">Bu anket tamamen anonimdir. Kişisel bilgileriniz kayıt altına alınmamaktadır.</p>
      <form id="surveyForm">
        <div id="questions"></div>
        <label class="label" for="suggestion">Daha iyi hizmet sunabilmemiz için görüş ve önerileriniz</label>
        <textarea id="suggestion" rows="5" placeholder="Görüşlerinizi buraya yazabilirsiniz..."></textarea>
        <label class="check-row"><input type="checkbox" id="contactAllowed" /><span>Benimle iletişime geçilebilir</span></label>
        <div id="phoneBox" class="hidden"><label class="label" for="phone">Telefon numaranız</label><input id="phone" type="tel" placeholder="05xx xxx xx xx" /></div>
        <button type="submit" id="submitBtn">Anketi Gönder</button>
        <p id="message" class="message"></p>
      </form>
    </section>
  </main>
  <script src="./survey.js"></script>
</body>
</html>
